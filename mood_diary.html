<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
  <title>График настроения</title>
  <style>
    * { box-sizing: border-box; }
    :root { --label-width: 152px; --score-width: 38px; --grid: rgba(60,60,67,.16); --seam: rgba(60,60,67,.28); color-scheme: light; }
    html { background: #f5f5f7; color: #1d1d1f; font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; min-width: 280px; background: #f5f5f7; color: #1d1d1f; }
    header { position: relative; padding: 28px 16px 22px; border-bottom: 1px solid #d2d2d7; background: rgba(255,255,255,.86); }
    h1 { margin: 0 0 18px; padding: 0 54px; font-size: 28px; line-height: 1.1; text-align: center; font-weight: 600; letter-spacing: -.025em; }
    .period { display: flex; justify-content: center; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
    .period label { display: flex; align-items: center; gap: 8px; color: #6e6e73; font-size: 15px; font-weight: 500; }
    .period input { width: 118px; height: 40px; border: 1px solid #c7c7cc; border-radius: 10px; padding: 5px 10px; background: #fff; color: #1d1d1f; font: inherit; box-shadow: inset 0 1px 1px rgba(0,0,0,.03); }
    .period input.year { width: 78px; }
    .period select { height: 40px; border: 1px solid #c7c7cc; border-radius: 10px; padding: 5px 30px 5px 10px; background: #fff; color: #1d1d1f; font: inherit; }
    .table-wrap { width: calc(100% - 24px); margin: 14px auto 0; overflow: auto; border: 1px solid #d2d2d7; border-radius: 16px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.045); -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
    table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; background: #fff; }
    th, td { height: 58px; padding: 3px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); background: #fff; color: #1d1d1f; text-align: center; vertical-align: middle; }
    tr:last-child > * { border-bottom: 0; }
    tr > *:last-child { border-right: 0; }
    thead th { height: 40px; font-size: 14px; font-weight: 500; }
    .row-label { position: sticky; left: 0; z-index: 2; width: var(--label-width); min-width: var(--label-width); max-width: var(--label-width); padding: 8px 10px; border-right: 0; text-align: left; font-size: 14px; line-height: 1.25; font-weight: 500; overflow-wrap: anywhere; }
    thead .row-label { z-index: 3; font-weight: 600; }
    .score { position: sticky; left: var(--label-width); z-index: 2; width: var(--score-width); min-width: var(--score-width); max-width: var(--score-width); border-right-color: var(--seam); color: #6e6e73; font-size: 13px; line-height: 1; font-weight: 600; }
    thead .score { z-index: 3; }
    .day { width: 58px; min-width: 58px; max-width: 58px; }
    .day, .score, .sleep-input { font-variant-numeric: tabular-nums; }
    .mark-cell { position: relative; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .mark-cell:hover { background: #fafafa; }
    .mark-cell:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #1d1d1f; outline-offset: 2px; }
    .cross { display: block; min-height: 25px; font-size: 26px; line-height: 1; font-weight: 300; }
    .note { display: block; width: 100%; margin: 3px auto 0; padding: 0 2px; color: #6e6e73; font-size: 10px; line-height: 1.25; overflow: visible; overflow-wrap: anywhere; white-space: pre-wrap; }
    .sleep-input { width: 44px; height: 44px; appearance: none; -webkit-appearance: none; border: 0; border-radius: 0; padding: 3px; background: transparent; color: #1d1d1f; font: inherit; font-size: 16px; text-align: center; }
    .stable .row-label { font-weight: 600; }
    footer { padding: 18px 12px 28px; color: #6e6e73; font-size: 12px; line-height: 1.4; text-align: center; }
    .actions { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    button { min-height: 40px; border: 1px solid #c7c7cc; border-radius: 10px; padding: 7px 14px; background: rgba(255,255,255,.9); color: #1d1d1f; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.2; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: transform .08s ease, background .15s ease; }
    button:hover { background: #fff; }
    button:active { transform: scale(.98); }
    .info-trigger { position: absolute; top: 14px; right: 14px; z-index: 4; min-width: 46px; border-color: transparent; background: #f5f5f7; color: #515154; }
    #saveData, #saveNote { border-color: #1d1d1f; background: #1d1d1f; color: #fff; }
    .save-status { min-height: 18px; color: #515154; font-size: 12px; }
    .author { margin-top: 5px; color: #86868b; letter-spacing: .01em; }
    .version { margin-top: 2px; color: #86868b; letter-spacing: .02em; }
    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(245,245,247,.84); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .overlay[hidden] { display: none; }
    .editor { width: min(420px, 100%); border: 1px solid #d2d2d7; border-radius: 18px; padding: 20px; background: #fff; box-shadow: 0 18px 60px rgba(0,0,0,.14); }
    .editor h2 { margin: 0 0 10px; font-size: 20px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; }
    .editor textarea { width: 100%; min-height: 110px; max-height: 52vh; resize: vertical; border: 1px solid #c7c7cc; border-radius: 12px; padding: 10px; background: #f5f5f7; color: #1d1d1f; font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .editor .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .info-panel { width: min(560px, 100%); max-height: calc(100vh - 36px); overflow: auto; }
    .info-content { color: #515154; font-size: 14px; line-height: 1.48; }
    .info-content h3 { margin: 18px 0 6px; color: #1d1d1f; font-size: 15px; line-height: 1.25; font-weight: 600; }
    .info-content h3:first-child { margin-top: 4px; }
    .info-content ul { margin: 0; padding-left: 21px; }
    .info-content li + li { margin-top: 6px; }
    .info-content p { margin: 0; }
    @media (max-width: 480px) {
      :root { --label-width: 136px; }
      header { padding: 22px 10px 18px; }
      h1 { margin-bottom: 16px; padding: 34px 0 0; font-size: 24px; }
      .info-trigger { top: 9px; right: 9px; }
      .period { gap: 9px 12px; }
      .period label { font-size: 14px; }
      .table-wrap { width: calc(100% - 16px); margin-top: 10px; border-radius: 13px; }
      .row-label { font-size: 13px; }
      .day { width: 56px; min-width: 56px; max-width: 56px; }
    }
    @media print {
      .actions, .save-status, .info-trigger, .overlay { display: none !important; }
      html, body { background: #fff; }
      header { background: #fff; }
      .table-wrap { width: 100%; margin: 0; overflow: visible; border-radius: 0; box-shadow: none; }
      @page { size: landscape; margin: 6mm; }
    }
  </style>
</head>
<body>
  <header>
    <button class="info-trigger" id="infoButton" type="button" aria-haspopup="dialog" aria-controls="infoOverlay">Info</button>
    <h1 id="title">ГРАФИК НАСТРОЕНИЯ</h1>
    <div class="period">
      <label><span id="monthLabel">Месяц</span> <input id="month" type="text" autocomplete="off" aria-label="Месяц"></label>
      <label><span id="yearLabel">Год</span> <input id="year" class="year" type="text" inputmode="numeric" autocomplete="off" aria-label="Год"></label>
      <select id="language" aria-label="Язык">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="nl">Nederlands</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </header>
  <main class="table-wrap" id="tableWrap" aria-label="Прокручиваемая таблица настроения">
    <table id="moodTable">
      <thead><tr id="daysRow"><th class="row-label" id="dayLabel" scope="col">День</th><th class="score" id="scoreLabel" scope="col">±</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </main>
  <footer>
    <div class="actions">
      <button id="saveData" type="button">Сохранить</button>
      <button id="downloadCopy" type="button">Скачать заполненную копию</button>
      <button id="printTable" type="button">Печать / PDF</button>
      <button id="clearTable" type="button">Очистить таблицу</button>
    </div>
    <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>
    <div class="author"><span id="authorLabel">Автор</span>: KoreNat</div>
    <div class="version">v.1.1</div>
  </footer>
  <div class="overlay" id="overlay" hidden>
    <section class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <h2 id="editorTitle">Запись</h2>
      <textarea id="noteInput" placeholder="Например: 09:00, 19:00"></textarea>
      <div class="buttons">
        <button id="cancelNote" type="button">Отмена</button>
        <button id="saveNote" type="button">Сохранить</button>
      </div>
    </section>
  </div>
  <div class="overlay" id="infoOverlay" hidden>
    <section class="editor info-panel" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <h2 id="infoTitle">Информация</h2>
      <div class="info-content" id="infoContent"></div>
      <div class="buttons">
        <button id="closeInfo" type="button">Закрыть</button>
      </div>
    </section>
  </div>
