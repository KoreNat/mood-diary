name: Build PozvoniMne Release APK

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pozvoni-mne
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 24)
          KEYSTORE="$RUNNER_TEMP/pozvonimne-release.jks"
          keytool -genkeypair             -keystore "$KEYSTORE"             -storepass "$PASS"             -keypass "$PASS"             -alias pozvonimne             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=PozvoniMne,O=PozvoniMne,C=NL"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign             --ks "$KEYSTORE"             --ks-key-alias pozvonimne             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out app/build/outputs/apk/release/PozvoniMne-v4-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/PozvoniMne-v4-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PozvoniMne-v4-release
          path: pozvoni-mne/app/build/outputs/apk/release/PozvoniMne-v4-release.apk
