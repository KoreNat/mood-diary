name: Build ClipSong APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK
        working-directory: clipsong
        run: gradle assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSong-release-unsigned
          path: clipsong/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Pack Android apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          DIR=$(dirname "$APKSIGNER")
          echo "Using $APKSIGNER"
          tar -czf /tmp/apksigner-tools.tgz -C "$DIR" apksigner lib/apksigner.jar

      - name: Upload Android apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tools
          path: /tmp/apksigner-tools.tgz
          if-no-files-found: error
